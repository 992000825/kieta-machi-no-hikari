<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>消えた町のひかり</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050914;color:white;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow:hidden}
#movie{position:fixed;inset:0;background:#050914}
.scene{position:absolute;inset:-5%;background:url("opening_title.png") center/cover no-repeat;opacity:0;transform:scale(1.08);animation:movie 30s linear forwards}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.05) 50%,rgba(0,0,0,.55))}
#text{position:absolute;left:8%;right:8%;bottom:10%;font-size:clamp(18px,4.5vw,34px);line-height:1.7;text-shadow:0 2px 8px #000;opacity:0;transition:opacity 1s}
#skip{position:absolute;right:18px;top:max(18px,env(safe-area-inset-top));z-index:4;background:#0008;border:1px solid #fff8;color:#fff;border-radius:20px;padding:9px 14px}
#title{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:#07101caa;opacity:0;transition:opacity 1.4s}
#title h1{font-family:serif;font-size:clamp(34px,9vw,76px);margin:0;text-shadow:0 0 18px #e5bd66}
#title p{font-size:clamp(14px,3.5vw,22px)}
#start{margin-top:24px;padding:12px 30px;border-radius:30px;border:1px solid #fff9;background:#ffffff18;color:white;font-size:18px}
@keyframes movie{
0%{opacity:0;transform:scale(1.10) translateX(0)}
6%{opacity:1}
35%{transform:scale(1.18) translateX(2%)}
65%{transform:scale(1.25) translateX(-2%)}
88%{opacity:1}
100%{opacity:0;transform:scale(1.32)}
}
</style></head>
<body>
<div id="movie">
 <div class="scene"></div><div class="shade"></div>
 <button id="skip">スキップ</button>
 <div id="text"></div>
 <div id="title"><h1>消えた町のひかり</h1><p>— 時をめぐる ふたりの冒険 —</p><button id="start">はじめる</button></div>
</div>
<script>
const t=document.getElementById("text"), title=document.getElementById("title");
const lines=[
[1200,"ある日、兄弟は一冊の古い地図を見つけた。"],
[6500,"そこに描かれていたのは——今はどこにもない町。"],
[12000,"地図をたよりに、ふたりは旅に出る。"],
[17500,"そして辿り着いたのは、時間が止まったような美しい町。"],
[23000,"この町に隠された秘密と、本当の「ひかり」を探して——"]
];
lines.forEach(([ms,s],i)=>setTimeout(()=>{t.style.opacity=0;setTimeout(()=>{t.textContent=s;t.style.opacity=1},450)},ms));
function end(){t.style.opacity=0;title.style.opacity=1}
setTimeout(end,28500);
document.getElementById("skip").onclick=end;
document.getElementById("start").onclick=()=>alert("ここからゲーム本編へつなげるで！");
</script></body></html>
